[project]
name = "inbox-lens"
version = "0.1.0"
description = "A privacy-conscious daily email digest assistant."
requires-python = ">=3.10"
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
inbox-lens = "inbox_lens.cli:main"

[project.optional-dependencies]
html = [
  "beautifulsoup4>=4.12",
  "html2text>=2024.2.26",
]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["inbox_lens*"]
